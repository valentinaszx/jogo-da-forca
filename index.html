<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Jogo da Forca</h1>
    <div id="palavra" class="palavra"></div>
    <div id="teclado" class="teclado"></div>
    <p id="status"></p>

  <!-- Campo oculto para ativar o teclado virtual do celular -->

  <script src="script.js"></script>
</body>
</html>
