<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="capa.png"/>
  <title>Jogo da Forca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <p class="etiqueta">DESAFIO DE PALAVRAS</p>
      <h1>Jogo da Forca</h1>
    </header>
    <section class="partida" aria-label="Partida atual">
      <p id="status" aria-live="polite" aria-atomic="true"></p>
      <div id="palavra" class="palavra" aria-live="polite"></div>
      <div class="historico-letras">
        <p id="rotuloLetras" class="rotulo-letras">Letras digitadas</p>
        <div id="letrasUsadas" class="letras-usadas" role="list" aria-labelledby="rotuloLetras"></div>
      </div>
    </section>
    <button id="reiniciar" type="button" onclick="iniciarJogo()">Novo jogo</button>
  </main>

  <!-- Campo oculto para ativar o teclado virtual do celular -->
  <input type="text" id="inputMovel" style="opacity: 0; position: absolute; pointer-events: none;" />

  <script src="script.js"></script>
</body>
</html>
