<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="capa.png">
  <title>Jogo da Forca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Jogo da Forca</h1>
    <div class="forca-palco">
      <svg id="forca" viewBox="0 0 220 220" role="img" aria-label="Forca com boneco desenhado conforme os erros">
        <path class="forca-estrutura" d="M25 200 H145 M55 200 V20 H155 V42" />
        <circle class="forca-parte" data-erro="1" pathLength="100" cx="155" cy="62" r="18" />
        <path class="forca-parte" data-erro="2" pathLength="100" d="M155 80 V132" />
        <path class="forca-parte" data-erro="3" pathLength="100" d="M155 94 L130 116" />
        <path class="forca-parte" data-erro="4" pathLength="100" d="M155 94 L180 116" />
        <path class="forca-parte" data-erro="5" pathLength="100" d="M155 132 L132 164" />
        <path class="forca-parte" data-erro="6" pathLength="100" d="M155 132 L178 164" />
      </svg>
    </div>
    <div id="palavra" class="palavra"></div>
    <div id="teclado" class="teclado"></div>
    <p id="status"></p>
    <button id="reiniciar" onclick="iniciarJogo()">Novo Jogo</button>
  </div>

  <!-- Campo oculto para ativar o teclado virtual do celular -->
  <input type="text" id="inputMovel" style="opacity: 0; position: absolute; pointer-events: none;" />

  <script src="script.js"></script>
</body>
</html>
